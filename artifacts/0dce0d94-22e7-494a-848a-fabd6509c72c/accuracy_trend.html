
            <html>
            <head>
                <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
            </head>
            <body style="font-family: sans-serif; background: #fff; padding: 20px;">
                <h4>Interactive Chart (Plotly mock)</h4>
                <div id="tester" style="width:100%;height:350px;max-width:600px;border:1px solid #eee;"></div>
                <script>
                    TESTER = document.getElementById('tester');
                    Plotly.newPlot( TESTER, [{
                    x: [1, 2, 3, 4, 5],
                    y: [10, 15, 13, 17, 22],
                    type: 'scatter',
                    mode: 'lines+markers',
                    marker: { color: 'rgb(37, 99, 235)' }
                    }], {
                    margin: { t: 10 } } );
                </script>
            </body>
            </html>
